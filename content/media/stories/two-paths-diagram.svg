<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img" aria-labelledby="t d">
<title id="t">Two paths to Brewer and Peggy</title>
<desc id="d">Brewer McKeehan and Peggy Patton had sons Samuel Brewer McKeehan and George McKeehan. Samuel Brewer's daughter Hannah Elizabeth and George's son Samuel W. were first cousins who married in 1860. Their children, among them Samuel Rosencrans McKeehan, who took the family west in 1898, descend from Brewer and Peggy along two lines.</desc>
<rect width="760" height="640" fill="#f3f1ea"/>
<path d="M380 70 V 108" fill="none" stroke="#55605e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M374 158 C 374 200, 190 190, 190 228" fill="none" stroke="#a2701a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M386 158 C 386 200, 570 190, 570 228" fill="none" stroke="#3b6e96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M190 278 V 338" fill="none" stroke="#a2701a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M570 278 V 338" fill="none" stroke="#3b6e96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M190 382 C 190 430, 374 420, 374 458" fill="none" stroke="#a2701a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M570 382 C 570 430, 386 420, 386 458" fill="none" stroke="#3b6e96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M377 498 V 548" fill="none" stroke="#a2701a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
